<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>DuckShooting</title>

        <link rel="stylesheet" href="./style.css" />
    </head>
    <body>
        <div class="main-container">
            <canvas id="canvas" width="1200px" height="700px"></canvas>

            <table id="debug-table">
                <tr>
                    <th>
                        <p class="object-name" id="cursorPosXLabel">
                            cursorPosX
                        </p>
                    </th>
                    <th>
                        <p class="state-value" id="cursorPosXValue">
                            cursorPosXValue
                        </p>
                    </th>
                </tr>
                <tr>
                    <th>
                        <p class="object-name" id="cursorPosYLabel">
                            cursorPosY
                        </p>
                    </th>
                    <th>
                        <p class="state-value" id="cursorPosYValue">
                            cursorPosYValue
                        </p>
                    </th>
                </tr>
                <tr>
                    <th>
                        <p class="object-name" id="cursorPosYLabel">
                            cursorPosY
                        </p>
                    </th>
                    <th>
                        <p class="state-value" id="cursorPosYValue">
                            cursorPosYValue
                        </p>
                    </th>
                </tr>
                <tr>
                    <th>
                        <p class="object-name" id="obj4">objectName</p>
                    </th>
                    <th>
                        <p class="state-value" id="state4">stateValue</p>
                    </th>
                </tr>
            </table>
            <button onclick="spawn5Balls()">Spawn ball</button>
            <button id="stopButton">Stop</button>
        </div>
        <script type="module" src="./scripts/script.js"></script>
    </body>
</html>
